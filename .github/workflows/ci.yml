name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  pinning:
    name: verify action pinning (pinner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install pinner
        # A pinned release, checked against its published digest (the install script
        # would fetch whatever release is latest).
        env:
          PINNER_VERSION: v0.0.18
          PINNER_SHA256: 1d7a95f7173f2ebc2f755ac2c517b7e3c3abdc9ab65f3c9b5aec3440e85ed262
        run: |
          curl -LsSf -o "$RUNNER_TEMP/pinner.tar.gz" \
            "https://github.com/ffalcinelli/pinner/releases/download/$PINNER_VERSION/pinner-linux-amd64.tar.gz"
          echo "$PINNER_SHA256  $RUNNER_TEMP/pinner.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/pinner.tar.gz" -C "$HOME/.local/bin" pinner
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pinner verify --check-osv --format github || (pinner verify --check-osv && exit 1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          # MSRV: keep in sync with rust-version in Cargo.toml.
          - os: ubuntu-latest
            toolchain: "1.85"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The Python extension is built and tested by maturin in the python job.
      - run: cargo test --workspace --exclude khagole-engine-py

  full-kernel:
    # The committed excerpt covers one year; this runs the full-range and golden tests.
    runs-on: ubuntu-latest
    env:
      # A missing kernel fails the tests instead of skipping them.
      KHAGOLE_REQUIRE_KERNEL: "1"
      ASTROCELESTE_REQUIRE_KERNEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kernels
          key: jpl-kernels-de440s
      - run: scripts/fetch-kernels.sh
      - run: cargo test --workspace --exclude khagole-engine-py --release

  targets:
    # Web (WASM) and mobile targets must keep compiling: the apps depend on them.
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, aarch64-linux-android, aarch64-apple-ios]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: build
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo build -p khagole-engine -p khagole-engine-wasm --lib --target ${{ matrix.target }}
      - name: check
        # Linking for mobile needs the NDK / Xcode; type-checking is what can break here.
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo check -p khagole-engine --lib --target ${{ matrix.target }}

  package:
    # Builds the crate from its packaged tarball, as crates.io will, so a file missing from
    # `include` or an oversized package fails here rather than at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo package -p khagole-engine
      - name: package size (crates.io limit is 10 MB)
        run: |
          size=$(stat -c %s target/package/khagole-engine-*.crate)
          echo "packaged crate: $size bytes"
          test "$size" -lt 10000000

  python:
    name: python bindings
    runs-on: ubuntu-latest
    env:
      KHAGOLE_REQUIRE_KERNEL: "1"
      ASTROCELESTE_REQUIRE_KERNEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kernels
          key: jpl-kernels-de440s
      - run: scripts/fetch-kernels.sh
      - name: build and test the wheel
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin==1.15.0 pytest
          .venv/bin/maturin build --release -m crates/khagole-engine-py/Cargo.toml -o dist
          .venv/bin/maturin sdist -m crates/khagole-engine-py/Cargo.toml -o sdist
          .venv/bin/pip install dist/*.whl
          .venv/bin/pytest -q crates/khagole-engine-py/tests

  wasm:
    name: wasm bindings
    runs-on: ubuntu-latest
    env:
      KHAGOLE_REQUIRE_KERNEL: "1"
      ASTROCELESTE_REQUIRE_KERNEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kernels
          key: jpl-kernels-de440s
      - run: scripts/fetch-kernels.sh
      - run: npm install --global wasm-pack@0.15.0
      - run: wasm-pack build --release --target nodejs --out-dir pkg-node crates/khagole-engine-wasm
      - run: node crates/khagole-engine-wasm/tests/golden.mjs
      - name: build and smoke-test the web package (the one published to npm)
        run: |
          wasm-pack build --release --target web crates/khagole-engine-wasm
          node crates/khagole-engine-wasm/tests/web_smoke.mjs

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
