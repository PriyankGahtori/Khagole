name: Release

# Trunk-based: pushing a `vX.Y.Z` tag on a commit of `main` publishes that version. The tag
# must match the workspace version in Cargo.toml and CHANGELOG.md must have a `## [X.Y.Z]`
# section (both prepared in a `chore: release` commit, e.g. with `release-plz update`).
# The `release` job publishes the crate to crates.io and creates the GitHub Release; the
# jobs below publish the Python wheels to PyPI and the WASM package to npm. All three
# registries use Trusted Publishing (OIDC): no long-lived tokens. crates.io and npm can only
# trust a workflow for a package that already exists, so the very first release falls back
# to short-lived secrets (CARGO_REGISTRY_TOKEN in the `crates-io` environment, NPM_TOKEN in
# `npm`), deleted once trusted publishing is set up.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    # Nothing is published unless the tagged commit passes the tests on the full kernel,
    # whatever CI said about it.
    name: test the tagged commit
    if: github.repository_owner == 'ffalcinelli'
    runs-on: ubuntu-latest
    env:
      ASTROCELESTE_REQUIRE_KERNEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kernels
          key: jpl-kernels-de440s
      - run: scripts/fetch-kernels.sh
      - run: cargo test --workspace --exclude astroceleste-engine-py --release

  release:
    name: publish
    needs: verify
    if: github.repository_owner == 'ffalcinelli'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - name: check tag, version and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "astroceleste-engine") | .version')
          [ "$TAG" = "v$version" ] \
            || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
          # Release notes: the body of the `## [X.Y.Z]` section, up to the next section.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" \
            || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        # Fails until trusted publishing is configured (first release): use the secret.
        continue-on-error: true
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p astroceleste-engine
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  wheels:
    name: wheel (${{ matrix.os }}, ${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          # musl: Alpine images (the Astroceleste API runs on python:3.12-alpine).
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # abi3: one wheel per platform serves every CPython >= 3.12.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist -m crates/astroceleste-engine-py/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'auto' }}
          path: dist

  sdist:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist -m crates/astroceleste-engine-py/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  pypi:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    name: publish to npm
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # npm >= 11.5 (Node 24) for trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install --global wasm-pack@0.15.0
      - run: wasm-pack build --release --target web crates/astroceleste-engine-wasm
      - run: node crates/astroceleste-engine-wasm/tests/web_smoke.mjs
      - name: publish
        working-directory: crates/astroceleste-engine-wasm/pkg
        env:
          # npm tries OIDC first; the token only serves the first publish.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm pkg set name=astroceleste-engine
          # wasm-pack copies neither the licenses nor NOTICE (Skyfield's MIT notice).
          cp -L ../../../LICENSE-MIT ../../../LICENSE-APACHE ../../../NOTICE .
          npm pkg set 'files[]=LICENSE-MIT' 'files[]=LICENSE-APACHE' 'files[]=NOTICE'
          npm publish --provenance --access public
