[package]
name = "khagole-engine-py"
description = "Python bindings for Khagole engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "khagole_engine_py"
crate-type = ["cdylib"]

[dependencies]
khagole-engine = { path = "../khagole-engine", version = "0.0.12" }
pyo3 = { version = "0.29", features = ["abi3-py312", "extension-module"] }
serde = "1"
serde_json = "1"
