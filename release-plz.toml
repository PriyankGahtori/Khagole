# Used locally by `release-plz update` to bump the version and write CHANGELOG.md from
# Conventional Commits. Publishing happens in CI when a `vX.Y.Z` tag is pushed
# (.github/workflows/release.yml), not through release-plz.
[workspace]
changelog_update = true
# Versions follow the core crate; bindings crates join the same release train.
dependencies_update = false

# The bindings are released through PyPI and npm by release.yml, not crates.io; they
# share the workspace version.
[[package]]
name = "khagole-engine-py"
release = false
publish = false

[[package]]
name = "khagole-engine-wasm"
release = false
publish = false
